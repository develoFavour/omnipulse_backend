name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - apps/api-gateway
          - apps/broadcast-worker
          - apps/compliance-engine
          - shared
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache-dependency-path: |
            go.work.sum
            apps/api-gateway/go.sum
            apps/broadcast-worker/go.sum
            apps/compliance-engine/go.sum
            shared/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # govulncheck is advisory for now: it analyzes the scanning toolchain's
      # standard library too, so a Go advisory the pinned toolchain cannot take
      # (like the current crypto/x509 one) would block every push. Its
      # call-graph analysis still separates reachable findings from noise in
      # the log — reachable third-party findings must be bumped, as the recent
      # x/net / go-jose / compress upgrades were.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
        continue-on-error: true
