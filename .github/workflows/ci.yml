name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - apps/api-gateway
          - apps/broadcast-worker
          - apps/compliance-engine
          - shared
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.work.sum
            apps/api-gateway/go.sum
            apps/broadcast-worker/go.sum
            apps/compliance-engine/go.sum
            shared/go.sum

      # The builder image fixes GOTOOLCHAIN=local, so a dependency that needs a
      # newer Go than its tag only fails on Render. Catch it here instead.
      - name: Toolchain guard
        if: matrix.module != 'shared'
        run: |
          set -euo pipefail
          floor=$(go list -m -f '{{.GoVersion}}' all | grep . | sort -V | tail -1)
          floor_minor=$(cut -d. -f1,2 <<< "$floor")
          builder=$(grep -m1 -oE '^FROM golang:[0-9.]+' Dockerfile | cut -d: -f2)
          echo "dependency floor go$floor, builder golang:$builder"
          if [ "$floor_minor" != "$builder" ] && \
             [ "$(printf '%s\n%s\n' "$floor_minor" "$builder" | sort -V | tail -1)" = "$floor_minor" ]; then
            echo "::error::A dependency requires go >= $floor but Dockerfile builds on golang:$builder"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # govulncheck stays advisory: it exits non-zero on any finding, including
      # ones our code never calls, and a stdlib advisory is only fixed by a Go
      # patch release that may not exist yet (crypto/x509 needs go1.27.3). Its
      # call-graph analysis still separates reachable findings from noise in
      # the log — reachable third-party findings must be bumped, as the recent
      # x/net / go-jose / compress upgrades were.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
        continue-on-error: true
